name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: it is what Ubuntu 22.04 ships, which is the
        # deployment the README describes. 3.9 was claimed but never tested.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run the test suite
        # Coverage floor comes from pyproject ([tool.coverage.report],
        # fail_under), so local and CI enforce the same number.
        run: python -m pytest --color=yes --cov --cov-report=term-missing

  quality:
    # Static gates. Kept in their own job so a lint failure is one glance away
    # instead of buried in a test matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check kb ingest scripts tests
      - name: Mypy
        run: mypy

  crisis-eval:
    # The safety path is the one part where an unmeasured regression is silent,
    # so the labelled set is a gate rather than a report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Measure the crisis detector
        run: python scripts/eval_crisis.py --min-recall 0.95 --min-precision 0.90
